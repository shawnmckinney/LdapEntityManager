[defaults]
# Inventory file
inventory = ./inventory/hosts

# Disable host key checking for localhost testing
host_key_checking = False

# Use a more readable output format
stdout_callback = yaml

# Display skipped tasks
display_skipped_hosts = False

# Increase default forks for better performance when looping
forks = 10

# Retry files location
retry_files_enabled = False

# Role path
roles_path = ./roles

[privilege_escalation]
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Pipelining improves performance
pipelining = True
